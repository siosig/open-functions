[package]
name = "open-functions-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Domain layer for open-functions: registry, build, runtime, pool, forwarding, and Pub/Sub integration"
repository.workspace = true

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# `cloudevents-sdk`'s own crate/lib name is `cloudevents` (see its
# Cargo.toml's `[lib] name = "cloudevents"`), so `cargo machete`'s
# name-based usage scan can't see `use cloudevents::...` as a use of this
# package and flags it as unused -- it is not; see pubsub/convert.rs.
[package.metadata.cargo-machete]
ignored = ["cloudevents-sdk"]

[dependencies]
tokio = { workspace = true }
http = { workspace = true }

cloudevents-sdk = { workspace = true, features = ["http-binding"] }
bollard = { workspace = true }
futures-util = { workspace = true }
cgroups-rs = { workspace = true }
redb = { workspace = true }
reqwest = { workspace = true }

tracing = { workspace = true }
metrics = { workspace = true }

async-trait = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
wiremock = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
