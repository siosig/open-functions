---
# Example inventory for ansible/site.yml.
#
# Copy this file (e.g. to inventory/hosts.yml, which is gitignored-style
# local-only convention here — nothing enforces the name) and adjust
# hostnames, connection details, and per-host variables for your
# environment. See README.md and roles/open_functions/defaults/main.yml for the
# full variable reference.
#
# Two example hosts are shown:
#   - open-functions-systemd-01: systemd deploy mode, standalone (no ps-rs).
#   - open-functions-docker-01:  docker deploy mode, co-located with ps-rs on the
#                       same host, both containers on the `open-functions` Docker
#                       network and addressed by container name. This is
#                       the standard co-location setup documented in
#                       specs/001-cloud-functions-local/contracts/ansible-vars.md.

all:
  children:
    open_functions:
      hosts:
        # --- systemd mode, standalone -----------------------------------
        open-functions-systemd-01:
          ansible_host: 203.0.113.10
          ansible_user: ansible
          open_functions_deploy_mode: systemd
          open_functions_admin_bind_address: 127.0.0.1
          # open_functions_source_dirs:
          #   - /srv/open-functions/functions

        # --- docker mode, co-located with ps-rs ---------------------------
        # ps-rs (Pub/Sub-compatible REST API) is deployed separately using
        # the ps-rs project's own Ansible role/playbook
        # (~/workspace/siosig/ps-rs), attached to the same `open_functions_docker_network`
        # (default: open-functions) under the container name `ps-rs`. open-functions is then
        # able to reach it, and ps-rs is able to push events back to open-functions,
        # by container name on that shared network.
        open-functions-docker-01:
          ansible_host: 203.0.113.20
          ansible_user: ansible
          open_functions_deploy_mode: docker
          open_functions_docker_network: open-functions
          open_functions_pubsub_base_url: http://ps-rs:8085
          open_functions_pubsub_project: local
          open_functions_pubsub_push_base_url: http://open-functions:8080
          # open_functions_source_mounts:
          #   - /srv/open-functions/functions
