---
# Public, user-overridable variables for the open_functions role.
#
# This table mirrors specs/001-cloud-functions-local/contracts/ansible-vars.md
# exactly - that file is the authoritative description of what each variable
# means and why it defaults the way it does. Keep the two in sync.

# --- Deploy mode -----------------------------------------------------------

# "systemd" | "docker". Anything else fails at preflight.
open_functions_deploy_mode: systemd

# Binary / image tag. The contract says this should "track the latest
# release" by default; pin an explicit version in your inventory for
# reproducible deploys.
open_functions_version: "0.1.0"

# --- Network ----------------------------------------------------------------

open_functions_invoke_port: 8080
open_functions_admin_port: 8081

# If this is not a loopback address, open_functions_admin_token is required
# (asserted in tasks/preflight.yml).
open_functions_admin_bind_address: 127.0.0.1
open_functions_admin_token: ""
open_functions_invoke_bind_address: 0.0.0.0

# Hostname-based routing domain, e.g. "fn.example.com". Empty disables it.
open_functions_host_suffix: ""

# --- Storage / build ---------------------------------------------------------

open_functions_data_dir: "{{ '/var/lib/open-functions' if open_functions_deploy_mode == 'systemd' else '/srv/open-functions/data' }}"
open_functions_build_mode: "{{ 'auto' if open_functions_deploy_mode == 'systemd' else 'container' }}"

# When true: the systemd unit gets SupplementaryGroups=docker, and the
# docker-mode container gets the docker socket bind-mounted plus
# --group-add <docker gid>. Needed only if functions are registered in
# build.mode = container / build.mode = auto falling back to container, or
# python.mode = container / python.mode = auto falling back to container
# (below).
open_functions_enable_docker: false

# --- Python (002-python-runtime) ---------------------------------------------

# "auto" | "host" | "container". docker deploy mode always needs "container"
# (the distributed open-functions image has no Python/uv - see
# docker/Dockerfile's header comment); systemd mode defaults to "auto"
# (falls back to host if a system python3.14 happens to be present, else
# container - either way requires open_functions_enable_docker: true unless
# python.mode is pinned to "host" and 3.14 really is on the host's PATH).
open_functions_python_mode: "{{ 'container' if open_functions_deploy_mode == 'docker' else 'auto' }}"
open_functions_python_installer: auto
open_functions_python_bin: ""
open_functions_python_container_image: "ghcr.io/astral-sh/uv:python3.14-trixie-slim"
open_functions_python_functions_framework: "functions-framework==3.10.2"

# Arbitrary extra environment variables passed through to the open-functions
# process itself (systemd unit `Environment=`, or the docker container's own
# env) - primarily for the uv/pip passthrough env vars
# (contracts/ops-config.md's 002 delta: UV_*/PIP_*/HTTP_PROXY/HTTPS_PROXY/
# NO_PROXY/SSL_CERT_FILE/SSL_CERT_DIR/NETRC), since open-functions reads those
# from its own process environment rather than a config key.
open_functions_extra_env: {}

# docker mode only: source directories bind-mounted read-only into the
# container at the same path, so source-mode function registrations can
# see them.
open_functions_source_mounts: []

# systemd mode only: paths added to BindReadOnlyPaths. When empty, the unit
# uses ProtectHome=read-only instead (see templates/open-functions.service.j2).
open_functions_source_dirs: []

# --- pubsub (open-pubusb co-location) ---------------------------------------------

open_functions_pubsub_base_url: "http://127.0.0.1:8085"
open_functions_pubsub_project: local
# open-functions's own URL, as seen from open-pubusb. Empty lets open-functions derive it itself.
open_functions_pubsub_push_base_url: ""

# --- Shutdown / logging -------------------------------------------------------

open_functions_shutdown_grace_secs: 30

open_functions_log_format: "{{ 'journald' if open_functions_deploy_mode == 'systemd' else 'json' }}"
open_functions_log_level: info

# Arbitrary extra config.toml content, merged on top of what this role
# renders. Keys matching a known section (invoke/admin/storage/build/
# runtime/defaults/pubsub/log/metrics) are merged into that section;
# any other top-level key is emitted as a brand new TOML section. Because
# open-functions's config schema uses deny_unknown_fields, an unknown section/key
# here will make `check-config` (run via the template `validate:` hook)
# fail loudly at deploy time - that is the intended safety net.
open_functions_extra_config: {}

# --- Release / binary ---------------------------------------------------------

open_functions_release_base_url: "https://github.com/siosig/open-functions/releases/download"
open_functions_checksum_url: "{{ open_functions_release_base_url }}/v{{ open_functions_version }}/SHA256SUMS"
open_functions_binary_path: /usr/local/bin/open-functions
open_functions_service_name: open-functions

# --- Docker image -------------------------------------------------------------

open_functions_image: "ghcr.io/siosig/open-functions"
open_functions_image_tag: "{{ open_functions_version }}"
open_functions_docker_network: open-functions
open_functions_docker_restart_policy: unless-stopped

# --- Verification ---------------------------------------------------------------

open_functions_verify: true
open_functions_verify_timeout_secs: 60
