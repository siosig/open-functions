---
# "service" tagged tasks here reconcile the running state (start/restart
# the unit, or create/reconcile the container) against whatever
# tasks/config.yml just rendered; "verify" tagged tasks confirm the
# result. Running the service-reconcile step here rather than in
# install_systemd.yml/install_docker.yml is what lets it happen after
# config.toml exists - see the ordering note at the top of
# tasks/main.yml.

- name: Ensure the open-functions service is enabled and started (systemd mode)
  ansible.builtin.systemd_service:
    name: "{{ open_functions_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
  when: open_functions_deploy_mode == 'systemd'
  tags:
    - service

- name: Look up the docker socket group id, for --group-add (docker mode)
  ansible.builtin.stat:
    path: /var/run/docker.sock
  register: open_functions_docker_socket_stat
  when: open_functions_deploy_mode == 'docker' and open_functions_enable_docker
  tags:
    - service

- name: Compute the open-functions container's published ports and volumes (docker mode)
  ansible.builtin.set_fact:
    open_functions_published_ports: >-
      {{
        [open_functions_invoke_bind_address ~ ':' ~ open_functions_invoke_port ~ ':' ~ open_functions_invoke_port ~ '/tcp',
         open_functions_admin_bind_address ~ ':' ~ open_functions_admin_port ~ ':' ~ open_functions_admin_port ~ '/tcp']
      }}
    open_functions_container_volumes: >-
      {{
        [open_functions_data_dir ~ ':' ~ open_functions_container_data_dir,
         open_functions_config_path ~ ':' ~ open_functions_config_path ~ ':ro']
        + (['/var/run/docker.sock:/var/run/docker.sock'] if open_functions_enable_docker else [])
        + (open_functions_source_mounts | map('regex_replace', '^(.*)$', '\1:\1:ro') | list)
      }}
  when: open_functions_deploy_mode == 'docker'
  tags:
    - service

- name: Run the open-functions container (docker mode)
  community.docker.docker_container:
    name: "{{ open_functions_service_name }}"
    image: "{{ open_functions_image }}:{{ open_functions_image_tag }}"
    state: started
    restart_policy: "{{ open_functions_docker_restart_policy }}"
    stop_timeout: "{{ open_functions_shutdown_grace_secs + 10 }}"
    networks:
      - name: "{{ open_functions_docker_network }}"
    networks_cli_compatible: true
    # No separate purge_networks: true - community.docker removed that
    # parameter (present as a module option in older 1.x/2.x releases,
    # gone by the >=3.10.0 this role's collection requirement pins, and
    # confirmed absent in the tested 5.2.2). The module's own docs now
    # point at exactly what comparisons: '*': strict below already does:
    # "To remove a container from one or more networks, use
    # `networks: strict` in the `comparisons` option."
    published_ports: "{{ open_functions_published_ports }}"
    volumes: "{{ open_functions_container_volumes }}"
    env: "{{ open_functions_extra_env if open_functions_extra_env | length > 0 else omit }}"
    groups: "{{ [open_functions_docker_socket_stat.stat.gid | string] if open_functions_enable_docker else omit }}"
    comparisons:
      '*': strict
  when: open_functions_deploy_mode == 'docker'
  tags:
    - service

- name: Read the running open-functions version (systemd mode)
  ansible.builtin.command:
    cmd: "{{ open_functions_binary_path }} version"
  register: open_functions_reported_version_systemd
  changed_when: false
  when: open_functions_deploy_mode == 'systemd'
  tags:
    - verify

- name: Read the running open-functions version (docker mode)
  ansible.builtin.command:
    cmd: "docker exec {{ open_functions_service_name }} open-functions version"
  register: open_functions_reported_version_docker
  changed_when: false
  when: open_functions_deploy_mode == 'docker'
  tags:
    - verify

- name: Assert the deployed open-functions binary/image matches open_functions_version
  ansible.builtin.assert:
    that:
      - >-
        open_functions_version in
        (open_functions_reported_version_systemd if open_functions_deploy_mode == 'systemd'
        else open_functions_reported_version_docker).stdout
    fail_msg: >-
      Deployed open-functions does not report version {{ open_functions_version }}:
      {{ (open_functions_reported_version_systemd if open_functions_deploy_mode == 'systemd' else open_functions_reported_version_docker).stdout }}
    quiet: true
  tags:
    - verify

- name: Wait for open-functions to report ready on /readyz
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ open_functions_admin_port }}/readyz"
    status_code: 200
    headers: "{{ {'Authorization': 'Bearer ' + open_functions_admin_token} if open_functions_admin_token | length > 0 else {} }}"
  register: open_functions_readyz
  until: open_functions_readyz.status == 200
  # The contract's literal "retries: 30, delay: 2" is a 60s budget, which
  # is exactly open_functions_verify_timeout_secs' default (60) - deriving retries
  # from it here (delay fixed at 2s) keeps that budget configurable
  # instead of silently ignoring open_functions_verify_timeout_secs.
  retries: "{{ (open_functions_verify_timeout_secs / 2) | round(0, 'ceil') | int }}"
  delay: 2
  when: open_functions_verify | bool
  tags:
    - verify
