---
# Renders config.toml and validates it with the real `open-functions check-config`
# parser before it is ever moved into place (ansible.builtin.template's
# `validate` runs against the rendered temp file, substituting %s for its
# path, and refuses to install it if the command exits non-zero).
#
# systemd mode: open_functions_binary_path is directly executable on the target
# host, so it validates the temp file in place.
#
# docker mode: open-functions is not installed on the target host's PATH at all (it
# only exists inside the image), so validation runs the same check inside
# a throwaway container instead, bind-mounting the temp file read-only.

- name: Render and validate config.toml (systemd mode)
  ansible.builtin.template:
    src: config.toml.j2
    dest: "{{ open_functions_config_path }}"
    owner: root
    group: "{{ open_functions_system_group }}"
    mode: "0640"
    validate: "{{ open_functions_binary_path }} check-config --config %s"
  when: open_functions_deploy_mode == 'systemd'
  notify:
    - restart open-functions service
  tags:
    - config

- name: Render and validate config.toml (docker mode)
  ansible.builtin.template:
    src: config.toml.j2
    dest: "{{ open_functions_config_path }}"
    owner: root
    group: root
    # 0644, not 0640: the running open-functions container reads this file through
    # a read-only bind mount (tasks/verify.yml's open_functions_container_volumes)
    # as the image's fixed non-root UID (ops-config.md, "Docker
    # integration": `USER nonroot`). That UID/GID isn't enumerated by the
    # contract, so - exactly like open_functions_data_dir's own host directory in
    # install_docker.yml, for the identical reason - this role has no way
    # to chown/chgrp the file to match it; 0640 root:root left the
    # container unable to open its own config at all
    # ("Permission denied", confirmed by actually running this). This
    # config.toml can carry open_functions_admin_token, so this is a real,
    # deliberate trade-off (host-world-readable) rather than a free
    # tightening - restrict open_functions_data_dir's *host* filesystem permissions
    # instead if that matters for your deployment, or set
    # open_functions_admin_token via token_file/Vault on a filesystem you control
    # separately.
    mode: "0644"
    # --user root: the template module's `validate` hook runs against its
    # own remote temp file *before* that file gets the mode/owner
    # requested above (those are only applied once validation has already
    # succeeded and the file is moved into place), so the temp file is
    # root-owned with a restrictive default mode at validate time. The
    # runtime image runs as a fixed non-root UID (ops-config.md, "Docker
    # integration": `USER nonroot`), which can't read that temp file
    # through the read-only bind mount below - `--user root` overrides
    # the user for just this throwaway validation container (never the
    # actual open-functions container, which is created separately in
    # tasks/verify.yml without this override) so it can.
    validate: >-
      docker run --rm --user root --entrypoint /usr/local/bin/open-functions
      -v %s:/tmp/open-functions-validate.toml:ro
      {{ open_functions_image }}:{{ open_functions_image_tag }}
      check-config --config /tmp/open-functions-validate.toml
  when: open_functions_deploy_mode == 'docker'
  notify:
    - restart open-functions container
  tags:
    - config
