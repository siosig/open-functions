---
# Internal, non-public constants for the open_functions role.
#
# Nothing here is documented in
# specs/001-cloud-functions-local/contracts/ansible-vars.md as a supported
# override point; treat these as implementation details of this role rather
# than a stable interface. (They can still be overridden with -e in a
# pinch, but doing so is unsupported.)

# systemd mode: dedicated system account the service runs as.
open_functions_system_user: open-functions
open_functions_system_group: open-functions

# Where the rendered config.toml lives, both on the systemd host and (via
# bind mount) inside the docker container. Matches the CLI's own
# --config/OPEN_FUNCTIONS_CONFIG resolution order documented in ops-config.md.
open_functions_config_dir: /etc/open-functions
open_functions_config_path: /etc/open-functions/config.toml

# Where the templated unit file is installed. The unit also declares
# StateDirectory={{ open_functions_service_name }}, but tasks/install_systemd.yml
# still explicitly manages open_functions_data_dir's ownership/mode itself instead
# of relying solely on that, so a custom (non-default) open_functions_data_dir is
# handled the same way as the default one.
open_functions_systemd_unit_path: "/etc/systemd/system/{{ open_functions_service_name }}.service"

# runtime.cgroup in config.toml.j2: cgroup v2 delegation is meaningless
# inside a docker container (the container never gets write access to the
# host cgroup tree), so default it off there and on ("auto") under
# systemd. Not exposed as a public variable because ops-config.md's
# Docker section already prescribes this as the fixed default for
# container images, not a per-deploy knob.
open_functions_runtime_cgroup: "{{ 'off' if open_functions_deploy_mode == 'docker' else 'auto' }}"

# Release asset architecture identifier, keyed by ansible_architecture.
# The contract only specifies open_functions_checksum_url's SHA256SUMS layout, not
# the release asset's own filename scheme, so "open-functions-linux-<arch>" below
# is a judgment call, not something the contract mandates.
open_functions_arch_map:
  x86_64: x86_64
  amd64: x86_64
  aarch64: aarch64
  arm64: aarch64

open_functions_release_arch: "{{ open_functions_arch_map[ansible_facts.architecture] | default(ansible_facts.architecture) }}"
open_functions_release_asset: "open-functions-linux-{{ open_functions_release_arch }}"
open_functions_release_url: "{{ open_functions_release_base_url }}/v{{ open_functions_version }}/{{ open_functions_release_asset }}"

# ops-config.md's "Docker integration" section fixes the image's own
# VOLUME mount point at /data. open_functions_data_dir (a public variable) is the
# *host*-side directory bind-mounted onto that path in docker mode, so the
# rendered config.toml's storage.data_dir must be this fixed in-container
# path rather than open_functions_data_dir itself when open_functions_deploy_mode == docker.
# Under systemd there is no such indirection: open_functions_data_dir is used
# as-is, since open-functions runs directly on the host.
open_functions_container_data_dir: /data
open_functions_config_storage_data_dir: "{{ open_functions_data_dir if open_functions_deploy_mode == 'systemd' else open_functions_container_data_dir }}"

# Same indirection applies to the listen addresses. Under docker, a
# process inside the container network namespace must bind 0.0.0.0 (the
# container's own "all interfaces") for Docker's host port-publish DNAT
# to be able to reach it at all - binding to a host-meaningful address
# like 127.0.0.1 or a host NIC's IP would make it unreachable from
# *outside* the container even after publishing, since docker's port
# forwarding arrives on the container's bridge interface, never its
# loopback. open_functions_invoke_bind_address / open_functions_admin_bind_address instead
# become the *host*-side publish bind address (see
# tasks/verify.yml's published_ports), which is what actually
# controls external reachability in docker mode - and is also what makes
# tasks/verify.yml's http://127.0.0.1:{{ open_functions_admin_port }}/readyz check
# (run from the target host, per the contract) work identically in both
# modes.
open_functions_config_invoke_listen: >-
  {{ open_functions_invoke_bind_address if open_functions_deploy_mode == 'systemd'
  else '0.0.0.0' }}:{{ open_functions_invoke_port }}
open_functions_config_admin_listen: >-
  {{ open_functions_admin_bind_address if open_functions_deploy_mode == 'systemd'
  else '0.0.0.0' }}:{{ open_functions_admin_port }}
