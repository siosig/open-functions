---
# Molecule "prepare" stage: build real open-functions release artifacts from this
# repo's own checked-out source and stage them where converge.yml's
# instances can reach them, once - `molecule test`'s sequence runs
# `prepare` a single time, right after `create` and before `converge`, and
# (unlike converge.yml) it is *not* re-run by the `idempotence` step, so
# building here never affects the changed=0 idempotence assertion.
#
# Why build instead of pointing at github.com/GHCR: open_functions_release_base_url
# / open_functions_checksum_url / open_functions_image (see ../../defaults/main.yml) all
# assume a real published GitHub Release exists to fetch from - this repo
# has no tagged release yet, so the role's real install_systemd.yml /
# install_docker.yml fetch logic would simply fail against the live
# internet. Building the actual binary/image from source here and
# pointing open_functions_release_base_url at a file:// path (systemd mode) / a
# locally-tagged image (docker mode) - see molecule.yml's host_vars - lets
# this scenario exercise the role's *real* fetch/validate/run logic
# end-to-end (get_url + checksum, `check-config` validation, `docker run`)
# rather than stubbing it out.
- name: Build local open-functions release artifacts for Molecule testing
  hosts: localhost
  connection: local
  gather_facts: false
  # By the time `prepare` runs, `create` has already started both
  # instances with this same host path bind-mounted in (see molecule.yml's
  # volumes:) - Docker auto-creates a missing bind-mount source directory
  # as root:root, so this play needs to become root itself to write into
  # it afterwards.
  become: true
  vars:
    # Keep these three in sync with molecule.yml's host_vars
    # (open_functions_release_base_url / open_functions_version / open_functions_image /
    # open_functions_image_tag) and with converge.yml's docker-load pre_task.
    open_functions_molecule_release_dir: /tmp/open-functions-molecule-release
    open_functions_molecule_version: "0.1.0"
    open_functions_molecule_image: open-functions-molecule
    # ansible/roles/open_functions/molecule/default -> ansible/roles/open_functions -> ...
    # -> repo root (5 directories up from this playbook's own directory).
    open_functions_molecule_repo_root: "{{ playbook_dir | dirname | dirname | dirname | dirname | dirname }}"
  tasks:
    - name: Create the local release artifact directory
      ansible.builtin.file:
        path: "{{ open_functions_molecule_release_dir }}/v{{ open_functions_molecule_version }}"
        state: directory
        mode: "0755"

    - name: Build the real open-functions Docker image from this repo's own Dockerfile
      ansible.builtin.command:
        cmd: "docker build -t {{ open_functions_molecule_image }}:{{ open_functions_molecule_version }} {{ open_functions_molecule_repo_root }}"
      changed_when: true

    - name: Create a throwaway container to extract the release binary from
      ansible.builtin.command:
        cmd: "docker create {{ open_functions_molecule_image }}:{{ open_functions_molecule_version }}"
      register: open_functions_molecule_extract_container
      changed_when: true

    - name: Copy the built binary out of the image (distroless has no shell to exec into)
      ansible.builtin.command:
        cmd: >-
          docker cp
          {{ open_functions_molecule_extract_container.stdout | trim }}:/usr/local/bin/open-functions
          {{ open_functions_molecule_release_dir }}/v{{ open_functions_molecule_version }}/open-functions-linux-x86_64
      changed_when: true

    - name: Remove the throwaway container
      ansible.builtin.command:
        cmd: "docker rm {{ open_functions_molecule_extract_container.stdout | trim }}"
      changed_when: true

    - name: Make the extracted binary executable
      ansible.builtin.file:
        path: "{{ open_functions_molecule_release_dir }}/v{{ open_functions_molecule_version }}/open-functions-linux-x86_64"
        mode: "0755"

    # get_url's checksum parameter, given "sha256:file://...", parses this
    # exact `<digest>  <filename>` layout (ansible.builtin.get_url's
    # parse_digest_lines()) - matching the real SHA256SUMS format open-functions's
    # own release process is expected to produce.
    - name: Write SHA256SUMS for the extracted binary
      ansible.builtin.shell:
        cmd: sha256sum open-functions-linux-x86_64 > SHA256SUMS
        chdir: "{{ open_functions_molecule_release_dir }}/v{{ open_functions_molecule_version }}"
      changed_when: true

    # The docker-mode instance runs its own nested Docker daemon (see
    # molecule.yml's docker-mode reasoning) with no route to this host's
    # daemon, so the image has to be handed over as a tar and `docker
    # load`-ed inside that instance - done in converge.yml's pre_tasks,
    # once the nested daemon is up.
    - name: Save the Docker image as a tar for the docker-mode instance's nested daemon
      ansible.builtin.command:
        cmd: >-
          docker save -o {{ open_functions_molecule_release_dir }}/open-functions-molecule-image.tar
          {{ open_functions_molecule_image }}:{{ open_functions_molecule_version }}
      changed_when: true
