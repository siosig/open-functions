---
# Molecule's dedicated "verify" step (verifier: name: ansible, see
# molecule.yml) - a plain Ansible playbook using assert/uri, independent
# of the role's own tasks/verify.yml (which already runs as part of
# converge). Checks, per spec-kit task T059 / ansible-vars.md's
# "idempotence and verify" section, for both deploy modes:
#   1. /readyz returns 200.
#   2. `open-functions version` (systemd) / `docker exec ... open-functions version` (docker)
#      matches open_functions_version.
#   3. (systemd only) the deployed unit has Delegate=yes.
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Wait for open-functions to report ready on /readyz
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ open_functions_admin_port | default(8081) }}/readyz"
        status_code: 200
        headers: "{{ {'Authorization': 'Bearer ' + open_functions_admin_token} if (open_functions_admin_token | default('')) | length > 0 else {} }}"
      register: open_functions_verify_readyz
      until: open_functions_verify_readyz.status == 200
      retries: 30
      delay: 2

    - name: Read the running open-functions version (systemd mode)
      ansible.builtin.command:
        cmd: "{{ open_functions_binary_path | default('/usr/local/bin/open-functions') }} version"
      register: open_functions_verify_version_systemd
      changed_when: false
      when: open_functions_deploy_mode == 'systemd'

    - name: Read the running open-functions version (docker mode)
      ansible.builtin.command:
        cmd: "docker exec {{ open_functions_service_name | default('open-functions') }} open-functions version"
      register: open_functions_verify_version_docker
      changed_when: false
      when: open_functions_deploy_mode == 'docker'

    - name: Assert the deployed open-functions binary/image reports open_functions_version
      ansible.builtin.assert:
        that:
          - >-
            open_functions_version in
            (open_functions_verify_version_systemd if open_functions_deploy_mode == 'systemd'
            else open_functions_verify_version_docker).stdout
        fail_msg: >-
          Deployed open-functions does not report version {{ open_functions_version }}:
          {{ (open_functions_verify_version_systemd if open_functions_deploy_mode == 'systemd' else open_functions_verify_version_docker).stdout }}
        quiet: true

    # ansible.builtin.systemd_service's own `status` return value is
    # populated from `systemctl show` (every property, Delegate included),
    # so this reads Delegate without shelling out to systemctl directly.
    # state: started is a no-op query here (the unit is already started by
    # the role's own tasks/verify.yml), so this stays changed=0.
    - name: Query the open-functions.service unit's properties (systemd mode)
      ansible.builtin.systemd_service:
        name: open-functions.service
        state: started
      register: open_functions_verify_service
      when: open_functions_deploy_mode == 'systemd'

    - name: Assert open-functions.service has Delegate=yes (systemd mode)
      ansible.builtin.assert:
        that:
          - open_functions_verify_service.status.Delegate == 'yes'
        fail_msg: >-
          open-functions.service does not have Delegate=yes:
          {{ open_functions_verify_service.status.Delegate | default('undefined') }}
        quiet: true
      when: open_functions_deploy_mode == 'systemd'
