---
# Molecule's dedicated "verify" step (verifier: name: ansible, see
# molecule.yml) - a plain Ansible playbook using assert/uri, independent
# of the role's own tasks/verify.yml (which already runs as part of
# converge). Checks, per spec-kit task T059 / ansible-vars.md's
# "idempotence and verify" section, for both deploy modes:
#   1. /readyz returns 200.
#   2. `cf-rs version` (systemd) / `docker exec ... cf-rs version` (docker)
#      matches cf_rs_version.
#   3. (systemd only) the deployed unit has Delegate=yes.
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Wait for cf-rs to report ready on /readyz
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ cf_rs_admin_port | default(8081) }}/readyz"
        status_code: 200
        headers: "{{ {'Authorization': 'Bearer ' + cf_rs_admin_token} if (cf_rs_admin_token | default('')) | length > 0 else {} }}"
      register: cf_rs_verify_readyz
      until: cf_rs_verify_readyz.status == 200
      retries: 30
      delay: 2

    - name: Read the running cf-rs version (systemd mode)
      ansible.builtin.command:
        cmd: "{{ cf_rs_binary_path | default('/usr/local/bin/cf-rs') }} version"
      register: cf_rs_verify_version_systemd
      changed_when: false
      when: cf_rs_deploy_mode == 'systemd'

    - name: Read the running cf-rs version (docker mode)
      ansible.builtin.command:
        cmd: "docker exec {{ cf_rs_service_name | default('cf-rs') }} cf-rs version"
      register: cf_rs_verify_version_docker
      changed_when: false
      when: cf_rs_deploy_mode == 'docker'

    - name: Assert the deployed cf-rs binary/image reports cf_rs_version
      ansible.builtin.assert:
        that:
          - cf_rs_version in (cf_rs_verify_version_systemd if cf_rs_deploy_mode == 'systemd' else cf_rs_verify_version_docker).stdout
        fail_msg: >-
          Deployed cf-rs does not report version {{ cf_rs_version }}:
          {{ (cf_rs_verify_version_systemd if cf_rs_deploy_mode == 'systemd' else cf_rs_verify_version_docker).stdout }}
        quiet: true

    # ansible.builtin.systemd_service's own `status` return value is
    # populated from `systemctl show` (every property, Delegate included),
    # so this reads Delegate without shelling out to systemctl directly.
    # state: started is a no-op query here (the unit is already started by
    # the role's own tasks/verify.yml), so this stays changed=0.
    - name: Query the cf-rs.service unit's properties (systemd mode)
      ansible.builtin.systemd_service:
        name: cf-rs.service
        state: started
      register: cf_rs_verify_service
      when: cf_rs_deploy_mode == 'systemd'

    - name: Assert cf-rs.service has Delegate=yes (systemd mode)
      ansible.builtin.assert:
        that:
          - cf_rs_verify_service.status.Delegate == 'yes'
        fail_msg: >-
          cf-rs.service does not have Delegate=yes:
          {{ cf_rs_verify_service.status.Delegate | default('undefined') }}
        quiet: true
      when: cf_rs_deploy_mode == 'systemd'
