---
# Provisioning only (host directories/network) - all tagged "install".
# Running the container itself lives in tasks/verify.yml instead (tagged
# "service"), because it bind-mounts config.toml and must not run before
# tasks/config.yml has rendered a real file there - otherwise Docker would
# create an empty *directory* at that path to satisfy the bind mount. See
# the ordering note at the top of tasks/main.yml.
#
# community.docker collection is assumed to already be installed on the
# control node (ansible/requirements.yml, a separate task, installs it -
# this role does not attempt to).

- name: Create the cf-rs host config directory
  ansible.builtin.file:
    path: "{{ cf_rs_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - install

# Ownership of this directory cannot be pinned precisely up front: the
# image runs as a fixed non-root UID (ops-config.md, "Docker integration":
# `USER nonroot`) that the contract does not enumerate, so this role has
# no way to chown it to match. World-writable is the pragmatic default
# for a purely-local data directory (redb/artifacts/build cache, no
# secrets live here); tighten it in your inventory if you know the
# image's nonroot UID.
- name: Create the cf-rs host data directory
  ansible.builtin.file:
    path: "{{ cf_rs_data_dir }}"
    state: directory
    mode: "0777"
  tags:
    - install

- name: Create source directories bind-mounted read-only into the container
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ cf_rs_source_mounts }}"
  tags:
    - install

- name: Create the cf-rs docker network
  community.docker.docker_network:
    name: "{{ cf_rs_docker_network }}"
    state: present
  tags:
    - install
